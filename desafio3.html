<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cálculo de Orçamento Mensal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Finanças Pessoais
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Início
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="desafio1.html">
                            Empréstimos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="desafio2.html">
                            Investimentos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="desafio3.html">
                            Orçamento
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="desafio4.html">
                            Cartões
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="desafio5.html">
                            Despesas
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <main class="section-padding">

        <div class="container">

            <div class="section-heading text-center">

                <span class="section-tag">
                    DESAFIO 3
                </span>

                <h1>
                    Cálculo de Orçamento Mensal
                </h1>

                <p>
                    Descubra quanto sobra ou falta do seu dinheiro
                    depois de pagar suas despesas.
                </p>

            </div>

            <div class="row justify-content-center">

                <div class="col-md-8 col-lg-6">

                    <div class="finance-card">

                        <div class="mb-3">

                            <label for="renda" class="form-label">
                                Renda mensal
                            </label>

                            <input
                                type="number"
                                id="renda"
                                class="form-control"
                                placeholder="Ex: 2500">

                        </div>

                        <div class="mb-3">

                            <label for="moradia" class="form-label">
                                Moradia
                            </label>

                            <input
                                type="number"
                                id="moradia"
                                class="form-control"
                                placeholder="Ex: 800">

                        </div>

                        <div class="mb-3">

                            <label for="alimentacao" class="form-label">
                                Alimentação
                            </label>

                            <input
                                type="number"
                                id="alimentacao"
                                class="form-control"
                                placeholder="Ex: 500">

                        </div>

                        <div class="mb-3">

                            <label for="transporte" class="form-label">
                                Transporte
                            </label>

                            <input
                                type="number"
                                id="transporte"
                                class="form-control"
                                placeholder="Ex: 300">

                        </div>

                        <div class="mb-3">

                            <label for="outros" class="form-label">
                                Outras despesas
                            </label>

                            <input
                                type="number"
                                id="outros"
                                class="form-control"
                                placeholder="Ex: 200">

                        </div>

                        <button
                            type="button"
                            class="btn btn-primary-custom w-100"
                            onclick="calcularOrcamento()">

                            Calcular orçamento

                        </button>

                        <div id="resultado" class="mt-4"></div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <footer class="footer">

        <div class="container text-center">

            <p>
                © 2026 Portal de Finanças Pessoais
            </p>

        </div>

    </footer>

    <script src="./JS/desafio3.js"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
