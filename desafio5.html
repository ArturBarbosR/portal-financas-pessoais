<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Organizador de Despesas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Finanças Pessoais
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Início
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="desafio1.html">
                            Empréstimos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="desafio2.html">
                            Investimentos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="desafio3.html">
                            Orçamento
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="desafio4.html">
                            Cartões
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="desafio5.html">
                            Despesas
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <main class="section-padding">

        <div class="container">

            <div class="section-heading text-center">

                <span class="section-tag">
                    DESAFIO 5
                </span>

                <h1>
                    Organizador de Despesas
                </h1>

                <p>
                    Adicione suas despesas e descubra quanto
                    você está gastando.
                </p>

            </div>

            <div class="row justify-content-center">

                <div class="col-md-8 col-lg-6">

                    <div class="finance-card">

                        <div class="mb-3">

                            <label for="despesa" class="form-label">
                                Nome da despesa
                            </label>

                            <input
                                type="text"
                                id="despesa"
                                class="form-control"
                                placeholder="Ex: Alimentação">

                        </div>

                        <div class="mb-3">

                            <label for="valorDespesa" class="form-label">
                                Valor
                            </label>

                            <input
                                type="number"
                                id="valorDespesa"
                                class="form-control"
                                placeholder="Ex: 50">

                        </div>

                        <button
                            type="button"
                            class="btn btn-primary-custom w-100"
                            onclick="adicionarDespesa()">

                            Adicionar despesa

                        </button>

                        <div id="lista" class="mt-4"></div>

                        <button
                            type="button"
                            class="btn btn-outline-custom w-100 mt-3"
                            onclick="calcularTotal()">

                            Calcular total

                        </button>

                        <div id="resultado" class="mt-4"></div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <footer class="footer">

        <div class="container text-center">

            <p>
                © 2026 Portal de Finanças Pessoais
            </p>

        </div>

    </footer>

    <script src="./JS/desafio5.js"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
