<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simulador de Investimentos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Finanças Pessoais
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Início</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="desafio1.html">
                            Empréstimos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="desafio2.html">
                            Investimentos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="desafio3.html">
                            Orçamento
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="desafio4.html">
                            Cartões
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="desafio5.html">
                            Despesas
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <main class="section-padding">

        <div class="container">

            <div class="section-heading text-center">

                <span class="section-tag">DESAFIO 2</span>

                <h1>Simulador de Investimentos</h1>

                <p>
                    Descubra quanto seu dinheiro pode render
                    ao longo do tempo.
                </p>

            </div>

            <div class="row justify-content-center">

                <div class="col-md-8 col-lg-6">

                    <div class="finance-card">

                        <div class="mb-3">

                            <label for="investimento" class="form-label">
                                Valor inicial
                            </label>

                            <input
                                type="number"
                                id="investimento"
                                class="form-control"
                                placeholder="Ex: 1000">

                        </div>

                        <div class="mb-3">

                            <label for="aporte" class="form-label">
                                Aporte mensal
                            </label>

                            <input
                                type="number"
                                id="aporte"
                                class="form-control"
                                placeholder="Ex: 200">

                        </div>

                        <div class="mb-3">

                            <label for="rendimento" class="form-label">
                                Rendimento mensal (%)
                            </label>

                            <input
                                type="number"
                                id="rendimento"
                                class="form-control"
                                placeholder="Ex: 1">

                        </div>

                        <div class="mb-3">

                            <label for="tempo" class="form-label">
                                Tempo em meses
                            </label>

                            <input
                                type="number"
                                id="tempo"
                                class="form-control"
                                placeholder="Ex: 12">

                        </div>

                        <button
                            type="button"
                            class="btn btn-primary-custom w-100"
                            onclick="calcularInvestimento()">

                            Calcular investimento

                        </button>

                        <div id="resultado" class="mt-4"></div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <footer class="footer">

        <div class="container text-center">

            <p>© 2026 Portal de Finanças Pessoais</p>

        </div>

    </footer>

    <script src="./JS/desafio2.js"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
