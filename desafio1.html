<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simulador de Empréstimos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Finanças Pessoais
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Início</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="desafio1.html">
                            Empréstimos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="desafio2.html">
                            Investimentos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="desafio3.html">
                            Orçamento
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="desafio4.html">
                            Cartões
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="desafio5.html">
                            Despesas
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <main class="section-padding">

        <div class="container">

            <div class="section-heading text-center">
                <span class="section-tag">DESAFIO 1</span>

                <h1>Simulador de Empréstimos</h1>

                <p>
                    Calcule o valor das parcelas de um empréstimo
                    com base no valor, juros e quantidade de meses.
                </p>
            </div>

            <div class="row justify-content-center">

                <div class="col-md-8 col-lg-6">

                    <div class="finance-card">

                        <div class="mb-3">
                            <label for="valor" class="form-label">
                                Valor do empréstimo
                            </label>

                            <input
                                type="number"
                                id="valor"
                                class="form-control"
                                placeholder="Ex: 5000">
                        </div>

                        <div class="mb-3">
                            <label for="juros" class="form-label">
                                Juros ao mês (%)
                            </label>

                            <input
                                type="number"
                                id="juros"
                                class="form-control"
                                placeholder="Ex: 2">
                        </div>

                        <div class="mb-3">
                            <label for="meses" class="form-label">
                                Quantidade de meses
                            </label>

                            <input
                                type="number"
                                id="meses"
                                class="form-control"
                                placeholder="Ex: 12">
                        </div>

                        <button
                            type="button"
                            class="btn btn-primary-custom w-100"
                            onclick="calcularEmprestimo()">
                            Calcular empréstimo
                        </button>

                        <div id="resultado" class="mt-4"></div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <footer class="footer">
        <div class="container text-center">
            <p>© 2026 Portal de Finanças Pessoais</p>
        </div>
    </footer>

    <script src="./JS/desafio1.js"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
